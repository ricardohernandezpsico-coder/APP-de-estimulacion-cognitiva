# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
# Desactivado (22-sep, Fase 1 del roadmap a Unity -- ver NeuroVida/CLAUDE.md): el
# build.gradle que exporta Unity (unity/AndroidExport/unityLibrary/build.gradle) define
# buildIl2CppImpl() como método de script llamado desde dentro de un doLast { } -- ese
# patrón de Groovy no es compatible con la configuration cache de Gradle ("Could not
# find method buildIl2CppImpl()..." al ejecutar :unityLibrary:buildIl2Cpp). No es algo
# editable acá: el archivo se pisa entero cada vez que se reexporta desde Unity.
org.gradle.configuration-cache=false
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true

# --- Unity as a Library (unityLibrary, Fase 1 del roadmap -- ver NeuroVida/CLAUDE.md) ---
# El build.gradle exportado por Unity (unity/AndroidExport/unityLibrary/build.gradle) lee
# estas propiedades de la raíz del proyecto que lo incluye (acá) -- no trae su propio
# gradle.properties. Valores copiados de unity/AndroidExport/gradle.properties tal cual
# los generó el export; si se reexporta con otra versión de Unity/NDK, actualizar acá
# también (el export pisa su propia carpeta pero no este archivo).
android.useAndroidX=true
android.enableJetifier=true
unityStreamingAssets=.json
unityProjectPath=unity/NeuroVidaCore
unity.projectPath=unity/NeuroVidaCore
unity.debugSymbolLevel=none
unity.buildToolsVersion=36.0.0
unity.minSdkVersion=24
unity.targetSdkVersion=36
unity.compileSdkVersion=36
unity.abiFilters=arm64-v8a
unity.androidSdkPath=C\:/Program Files/Unity/Hub/Editor/6000.0.84f1/Editor/Data/PlaybackEngines/AndroidPlayer/SDK
unity.androidNdkPath=C\:/Program Files/Unity/Hub/Editor/6000.0.84f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK
unity.androidNdkVersion=27.2.12479018
unity.jdkPath=C\:/Program Files/Unity/Hub/Editor/6000.0.84f1/Editor/Data/PlaybackEngines/AndroidPlayer/OpenJDK
unity.javaCompatabilityVersion=VERSION_17
